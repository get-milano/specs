name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate conformance suite and schemas
        run: |
          pip3 install --quiet jsonschema
          python3 tools/validate_suite.py
      - name: Reference-check vectors against spec semantics
        run: python3 tools/reference_check.py
      # The tools' own tests. Discovery, so a new tools/test_*.py runs
      # without touching this workflow. No compilers here: this repository
      # stays engine-free, and the SDK compiles the generated output on
      # its side (its samples are built from it).
      - name: Tool tests
        run: python3 -m unittest discover --start-directory tools --pattern "test_*.py" --verbose
